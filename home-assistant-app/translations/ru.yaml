configuration:
  security:
    name: Безопасность и API
    description: Токены приложения. Секрет OTP можно сгенерировать автоматически.
    fields:
      api_token:
        name: Токен HTTP API
        description: Bearer-токен для защищённых методов API. Не публикуйте его.
      app_secret:
        name: Секрет OTP
        description: Оставьте пустым — приложение создаст и сохранит стойкий секрет.
  sms:
    name: Канал SMS
    description: Выберите основной транспорт для портала, OTP и HTTP API.
    fields:
      backend:
        name: Основной транспорт
        description: mqtt — Wiren Board; mmcli — USB-модем через ModemManager.
  wirenboard:
    name: Wiren Board
    description: Защищённое MQTT-подключение и топик обязательного send_sms.js.
    fields:
      mqtt_host:
        name: Адрес MQTT
      mqtt_port:
        name: Порт MQTT
      mqtt_username:
        name: Пользователь MQTT
      mqtt_password:
        name: Пароль MQTT
      sms_topic:
        name: Топик отправки SMS
  usb:
    name: USB-модем
    description: Используется только при выборе транспорта mmcli.
    fields:
      modem_id:
        name: ID модема
        description: Оставьте any для автоматического выбора первого доступного модема.
  unifi:
    name: UniFi Network
    description: Подключение к контроллеру и длительность гостевого доступа.
    fields:
      dry_run:
        name: Тестовый режим
        description: Не авторизует, не отзывает и не блокирует клиентов.
      base_url:
        name: Адрес контроллера
      api_key:
        name: API-ключ
        description: Предпочтительный способ авторизации.
      username:
        name: Локальный пользователь
        description: Заполняйте только если не используется API-ключ.
      password:
        name: Локальный пароль
      site:
        name: Сайт
      verify_tls:
        name: Проверять TLS-сертификат
      auth_minutes:
        name: Гостевой доступ, минут
        description: В веб-интерфейсе приложения это значение можно менять в днях.
  portal:
    name: Оформление портала
    description: Базовое оформление. Логотип и предпросмотр доступны в веб-интерфейсе.
    fields:
      title:
        name: Текст приветствия
      background_color:
        name: Цвет фона
      logo_size:
        name: Размер логотипа, px
  telegram:
    name: Telegram
    description: Необязательные служебные уведомления приложения.
    fields:
      bot_token:
        name: Токен бота
      chat_id:
        name: ID чата
  otp:
    name: Одноразовые коды
    description: Срок действия, длина кода и защита от повторных попыток.
    fields:
      ttl_seconds:
        name: Срок действия, секунд
      length:
        name: Длина кода
      resend_seconds:
        name: Повторная отправка через, секунд
      max_attempts:
        name: Максимум попыток
network:
  8088/tcp: API отправки SMS
  8880/tcp: Гостевой портал UniFi
