configuration:
  security:
    name: Security and API
    description: Application tokens. The OTP secret can be generated automatically.
    fields:
      api_token:
        name: HTTP API token
        description: Bearer token for protected API methods. Keep it private.
      app_secret:
        name: OTP secret
        description: Leave empty to generate and persist a strong secret automatically.
  sms:
    name: SMS transport
    description: Select the default transport for the portal, OTP and HTTP API.
    fields:
      backend:
        name: Default transport
        description: mqtt for Wiren Board; mmcli for a USB modem through ModemManager.
  wirenboard:
    name: Wiren Board
    description: Protected MQTT connection and the topic provided by send_sms.js.
    fields:
      mqtt_host:
        name: MQTT host
      mqtt_port:
        name: MQTT port
      mqtt_username:
        name: MQTT username
      mqtt_password:
        name: MQTT password
      sms_topic:
        name: SMS command topic
  usb:
    name: USB modem
    description: Used only when mmcli is selected as the transport.
    fields:
      modem_id:
        name: Modem ID
        description: Keep any to select the first available modem automatically.
  unifi:
    name: UniFi Network
    description: Controller connection and guest access lifetime.
    fields:
      dry_run:
        name: Dry-run mode
        description: Prevents client authorization, revocation and blocking changes.
      base_url:
        name: Controller URL
      api_key:
        name: API key
        description: Preferred authentication method.
      username:
        name: Local username
        description: Use only when an API key is not configured.
      password:
        name: Local password
      site:
        name: Site
      verify_tls:
        name: Verify TLS certificate
      auth_minutes:
        name: Guest access, minutes
        description: The application web UI also lets you edit this value in days.
  portal:
    name: Portal appearance
    description: Basic appearance. Logo upload and preview are available in the web UI.
    fields:
      title:
        name: Welcome text
      background_color:
        name: Background color
      logo_size:
        name: Logo size, px
  telegram:
    name: Telegram
    description: Optional operational notifications from the application.
    fields:
      bot_token:
        name: Bot token
      chat_id:
        name: Chat ID
  otp:
    name: One-time codes
    description: Code lifetime, length and retry protection.
    fields:
      ttl_seconds:
        name: Lifetime, seconds
      length:
        name: Code length
      resend_seconds:
        name: Resend delay, seconds
      max_attempts:
        name: Maximum attempts
network:
  8088/tcp: SMS API
  8880/tcp: UniFi guest portal
