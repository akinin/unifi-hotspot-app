configuration:
  api_token:
    name: API token
    description: Required bearer token for protected HTTP API methods.
  app_secret:
    name: OTP secret
    description: Leave empty to generate and persist a random secret automatically.
  wb_mqtt_host:
    name: MQTT host
  wb_mqtt_port:
    name: MQTT port
  wb_mqtt_username:
    name: MQTT username
  wb_mqtt_password:
    name: MQTT password
  wb_sms_topic:
    name: SMS command topic
  unifi_dry_run:
    name: UniFi dry-run
    description: Prevent all client authorization, revocation, and blocking changes.
  unifi_base_url:
    name: UniFi URL
  unifi_api_key:
    name: UniFi API key
  unifi_username:
    name: UniFi local username
  unifi_password:
    name: UniFi local password
  unifi_site:
    name: UniFi site
  unifi_verify_tls:
    name: Verify UniFi TLS certificate
  unifi_auth_minutes:
    name: Guest access duration
  hotspot_portal_title:
    name: Portal title
  telegram_bot_token:
    name: Telegram bot token
  telegram_chat_id:
    name: Telegram chat ID
  otp_ttl_seconds:
    name: OTP lifetime
  otp_length:
    name: OTP length
  otp_resend_seconds:
    name: OTP resend delay
  otp_max_attempts:
    name: Maximum OTP attempts
network:
  8088/tcp: SMS API
  8880/tcp: UniFi hotspot portal
