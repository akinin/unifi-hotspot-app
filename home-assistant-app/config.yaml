name: UniFi Hotspot
version: "0.6.2"
slug: wirenboard_sms
description: UniFi guest portal with an integrated WB or USB SMS gateway
url: https://github.com/akinin/wirenboard-sms/tree/main/home-assistant-app
arch:
  - aarch64
  - amd64
init: false
startup: services
stage: experimental
ingress: true
ingress_port: 8089
ingress_entry: admin/
panel_icon: mdi:wifi-lock
panel_title: UniFi Hotspot
ports:
  8088/tcp: 18088
  8880/tcp: 18880
ports_description:
  8088/tcp: SMS API (test port by default)
  8880/tcp: UniFi hotspot portal (test port by default)
options:
  security:
    api_token: ""
    app_secret: ""
  sms:
    backend: mqtt
  wirenboard:
    mqtt_host: 10.10.100.5
    mqtt_port: 1884
    mqtt_username: ""
    mqtt_password: ""
    sms_topic: /devices/sms_sender/controls/send/on
  usb:
    modem_id: any
  unifi:
    dry_run: true
    base_url: https://10.10.1.1
    api_key: ""
    username: ""
    password: ""
    site: default
    verify_tls: false
    auth_minutes: 1440
  portal:
    title: Welcome to Olshaniki
    background_color: "#10141b"
    logo_size: 132
  telegram:
    bot_token: ""
    chat_id: ""
  otp:
    ttl_seconds: 300
    length: 6
    resend_seconds: 60
    max_attempts: 5
schema:
  security:
    api_token: password
    app_secret: password
  sms:
    backend: list(mqtt|mmcli)
  wirenboard:
    mqtt_host: str
    mqtt_port: port
    mqtt_username: str?
    mqtt_password: password
    sms_topic: str
  usb:
    modem_id: str
  unifi:
    dry_run: bool
    base_url: url?
    api_key: password
    username: str?
    password: password
    site: str
    verify_tls: bool
    auth_minutes: int(1,525600)
  portal:
    title: str
    background_color: str
    logo_size: int(64,240)
  telegram:
    bot_token: password
    chat_id: str?
  otp:
    ttl_seconds: int(60,3600)
    length: int(4,10)
    resend_seconds: int(10,3600)
    max_attempts: int(1,20)
image: ghcr.io/akinin/wirenboard-sms-app
usb: true
udev: true
